<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FantaAsta">
  <!--
    Una calcolatrice, pensata per reggere a 16 pixel.

    Il corpo occupa tutto il riquadro invece di stare dentro una pastiglia:
    a icona piccola ogni pixel di margine e' area persa. La silhouette che
    si riconosce e' "barra in alto, griglia di tasti sotto", quindi i tasti
    sono sei e non dodici — a 16px una griglia 3x4 diventa una macchia.

    Per cambiarlo: questo file e src/components/Marchio.tsx vanno tenuti
    identici nella forma.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c46f0"/>
      <stop offset="1" stop-color="#3d1f7a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>

  <!-- Display -->
  <rect x="12" y="10" width="40" height="13" rx="3" fill="#00ff87"/>

  <!-- Tasti: due file da tre -->
  <g fill="#00ff87">
    <rect x="12" y="31" width="10" height="10" rx="2"/>
    <rect x="27" y="31" width="10" height="10" rx="2"/>
    <rect x="42" y="31" width="10" height="10" rx="2"/>
    <rect x="12" y="46" width="10" height="10" rx="2"/>
    <rect x="27" y="46" width="10" height="10" rx="2"/>
    <rect x="42" y="46" width="10" height="10" rx="2"/>
  </g>
</svg>
