<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FantaAsta">
  <!--
    Marchio provvisorio, pensato per reggere a 16 pixel: una sola forma piena,
    nessun dettaglio sottile, contrasto alto. La A e' quella di Asta.
    Per cambiarlo basta sostituire questo file e la forma in Marchio.tsx.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c46f0"/>
      <stop offset="1" stop-color="#3d1f7a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
  <path
    fill="#00ff87"
    fill-rule="evenodd"
    d="M32 12.5 49.5 51.5h-8.2l-2.9-7H25.6l-2.9 7h-8.2L32 12.5Zm0 14.8-3.7 9.4h7.4L32 27.3Z"
  />
